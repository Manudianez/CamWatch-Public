<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<style>
  :root {
    --steel-hi: #f7f9fb;
    --steel-1: #e4e8ec;
    --steel-2: #c5cbd2;
    --steel-3: #9aa2ab;
    --steel-edge: #747c86;
    --ink: #1c2229;
    --ink-soft: #4d5661;
    --well: #12171c;
    --well-text: #d9f2ff;
    --accent: #1f6fa8;
    --live: #1fb866;
    --busy: #e2a11a;
    --off: #7d8590;
    --bad: #c8402f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    /* acero cepillado: vetas finas horizontales sobre un degradado frío */
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.035) 1px 2px, transparent 2px 4px),
      linear-gradient(115deg, #aeb5bd 0%, #dfe3e7 22%, #b9c0c8 45%, #e9ecef 63%, #a9b0b9 82%, #cfd4d9 100%);
    background-attachment: fixed;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 56px; }

  /* chapa pulida */
  .plate {
    background: linear-gradient(180deg, var(--steel-hi) 0%, var(--steel-1) 38%, var(--steel-2) 100%);
    border: 1px solid var(--steel-edge);
    border-radius: var(--radius);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 -1px 0 rgba(0,0,0,.18),
      0 1px 2px rgba(0,0,0,.25),
      0 10px 24px -10px rgba(20,30,40,.45);
  }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  h1 {
    margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    background: linear-gradient(180deg, #6b7480 0%, #2a3038 46%, #11161b 54%, #56606b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.7));
  }
  .tag { color: var(--ink-soft); font-size: 13px; }
  #user { margin-left: auto; font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; text-align: right; }
  #user button { padding: 6px 12px; font-size: 13px; font-weight: 600; }

  .add { display: flex; gap: 10px; padding: 14px; }
  .add input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--well-text);
    padding: 12px 14px; border-radius: 8px; border: 1px solid #05080a;
    background: var(--well);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.8);
  }
  .add input::placeholder { color: #6f8491; }
  .add input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
    padding: 12px 20px; border-radius: 8px; border: 1px solid var(--steel-edge);
    background: linear-gradient(180deg, #fff 0%, #dde1e6 45%, #b4bbc3 55%, #cdd2d8 100%);
    box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.3);
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0,0,0,.35); }
  #msg { min-height: 20px; margin: 8px 4px 14px; font-size: 13px; color: var(--bad); font-weight: 600; }

  #cards { display: grid; gap: 18px; }
  .card { padding: 16px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .who { min-width: 0; flex: 1; }
  .name { font-size: 20px; font-weight: 800; overflow-wrap: anywhere; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink-soft); }
  .led {
    width: 11px; height: 11px; border-radius: 50%; flex: none; background: var(--off);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.6), 0 0 0 1px rgba(0,0,0,.35);
  }
  .led.live { background: var(--live); box-shadow: inset 0 1px 1px rgba(255,255,255,.7), 0 0 0 1px rgba(0,0,0,.3), 0 0 10px 2px rgba(31,184,102,.75); }
  .led.busy { background: var(--busy); box-shadow: inset 0 1px 1px rgba(255,255,255,.7), 0 0 0 1px rgba(0,0,0,.3), 0 0 10px 2px rgba(226,161,26,.7); }
  .led.bad  { background: var(--bad); }
  .remove { padding: 8px 12px; font-weight: 600; font-size: 13px; }

  .error { margin: 10px 2px 0; color: var(--bad); font-size: 13px; font-weight: 600; }

  .dials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  .dial {
    background: var(--well); border-radius: 8px; padding: 10px 12px; border: 1px solid #05080a;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.85);
  }
  .dial .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8fa5b3; }
  .dial .value {
    font: 700 30px/1.15 ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
    font-variant-numeric: tabular-nums; color: var(--well-text);
    text-shadow: 0 0 10px rgba(120,205,255,.45);
  }

  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .box {
    background: rgba(255,255,255,.55); border: 1px solid var(--steel-3); border-radius: 8px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.18); min-width: 0;
  }
  .box h3 {
    margin: 0; padding: 8px 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-soft); border-bottom: 1px solid var(--steel-3);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .box h3 span { letter-spacing: 0; text-transform: none; font-weight: 500; }
  .box ul { list-style: none; margin: 0; padding: 4px 0; max-height: 230px; overflow-y: auto; }
  .box li { padding: 5px 12px; display: flex; gap: 8px; align-items: baseline; }
  .box li + li { border-top: 1px solid rgba(0,0,0,.06); }
  .box .u { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
  .box .amt { margin-left: auto; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .box .t { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .box .note { padding: 10px 12px; color: var(--ink-soft); font-size: 13px; }

  .empty { padding: 34px 18px; text-align: center; color: var(--ink-soft); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

  @media (max-width: 640px) {
    h1 { font-size: 24px; }
    .tag { display: none; }
    .lists { grid-template-columns: 1fr; }
    .dials { gap: 8px; }
    .dial { padding: 8px; }
    .dial .value { font-size: 21px; }
    .dial .label { font-size: 10px; letter-spacing: .04em; }
  }
  /* selector de plataforma: dos teclas de acero, la elegida queda hundida */
  .switch { display: flex; gap: 0; margin-bottom: 14px; padding: 6px; }
  .switch button {
    flex: 1; border-radius: 0; font-size: 16px; padding: 12px 10px; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .switch button:first-child { border-radius: 7px 0 0 7px; }
  .switch button:last-child { border-radius: 0 7px 7px 0; border-left: 0; }
  .switch button[aria-pressed="true"] {
    color: var(--ink);
    background: linear-gradient(180deg, #aeb5bd 0%, #c9ced4 50%, #dfe3e7 100%);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.4);
  }
  .switch .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .switch button[aria-pressed="true"] .dot { background: var(--accent); box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 0 8px 1px var(--accent); }
  .login { padding: 34px 22px; text-align: center; }
  .login h2 { margin: 0 0 8px; font-size: 22px; }
  .login p { margin: 0 auto 18px; max-width: 520px; color: var(--ink-soft); }
  .login a.go {
    display: inline-block; font-weight: 700; font-size: 16px; color: var(--ink); text-decoration: none;
    padding: 13px 26px; border-radius: 8px; border: 1px solid var(--steel-edge);
    background: linear-gradient(180deg, #fff 0%, #dde1e6 45%, #b4bbc3 55%, #cdd2d8 100%);
    box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.3);
  }
  .login a.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .login small { display: block; margin-top: 16px; color: var(--ink-soft); }
  .notice { padding: 12px 16px; margin-bottom: 14px; font-weight: 600; }
  .notice a { color: var(--accent); }
  .foot { margin: 10px 2px 0; color: var(--ink-soft); font-size: 12px; }
  .box .sub { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{APP_NAME}}</h1>
    <span class="tag">Contador en vivo de Stripchat y Chaturbate</span>
    <span id="user"></span>
  </header>
  <div id="main"></div>
</div>

<script>
const main = document.getElementById('main');
const nf = new Intl.NumberFormat('es-ES');
const REFRESH_MS = 60000;
const rooms = new Map();   // modelo -> { el, data, error, timer }
let session = null;
let site = null;       // plataforma elegida
let input = null;
let cards = null;
let msg = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function ago(when) {
  if (!when) return '';
  const s = Math.max(0, (Date.now() - new Date(when).getTime()) / 1000);
  if (s < 90) return 'hace un momento';
  if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
  return 'hace ' + Math.floor(s / 3600) + ' h';
}

async function api(path, options) {
  const response = await fetch(path, Object.assign({ cache: 'no-store' }, options));
  if (response.status === 401) { location.href = '/'; throw new Error('401'); }
  let body = null;
  try { body = await response.json(); } catch (e) {}
  if (!response.ok) {
    const error = new Error((body && body.detail) || 'No se pudo completar la operación.');
    error.status = response.status;
    throw error;
  }
  return body;
}

const LOGIN_ERRORS = {
  denied: 'No se completó el inicio de sesión en Statbate.',
  state: 'El inicio de sesión caducó. Inténtalo de nuevo.',
  signin: 'Statbate no aceptó el inicio de sesión. Inténtalo de nuevo.',
  config: '{{APP_NAME}} todavía no está registrado en Statbate.',
};

function showLogin() {
  const box = el('section', 'login plate');
  box.append(el('h2', null, 'Sigue a tus modelos en vivo'));
  box.append(el('p', null,
    'Elige Stripchat o Chaturbate y mira si están en línea, quién está en la sala y cuántos tokens han dado. ' +
    'Los datos vienen de Statbate: entra con tu cuenta para verlos.'));
  const error = new URLSearchParams(location.search).get('error');
  if (error && LOGIN_ERRORS[error]) {
    const note = el('p', null, LOGIN_ERRORS[error]);
    note.style.color = 'var(--bad)'; note.style.fontWeight = '600';
    note.setAttribute('role', 'alert');
    box.append(note);
    history.replaceState(null, '', '/');
  }
  if (session.configured) {
    const go = el('a', 'go', 'Entrar con Statbate');
    go.href = '/oauth/statbate/login';
    box.append(go);
    box.append(el('small', null, 'Necesitas una cuenta de Statbate con plan Simple Plus o Studio Plus. {{APP_NAME}} nunca ve tu contraseña.'));
  } else {
    box.append(el('small', null, 'Falta configurar STATBATE_CLIENT_ID en el servidor.'));
  }
  main.replaceChildren(box);
}

function showApp() {
  const user = document.getElementById('user');
  const who = el('span', null, session.name + (session.plan.title ? ' · ' + session.plan.title : ''));
  const out = el('button', null, 'Salir');
  out.type = 'button';
  out.onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; };
  user.replaceChildren(who, out);

  const picker = el('div', 'switch plate');
  picker.setAttribute('role', 'group');
  picker.setAttribute('aria-label', 'Plataforma');
  for (const info of session.sites) {
    const key = el('button');
    key.type = 'button';
    key.dataset.site = info.id;
    key.append(el('span', 'dot'), el('span', null, info.label));
    key.onclick = () => selectSite(info.id);
    picker.append(key);
  }

  const form = el('form', 'add plate');
  form.autocomplete = 'off';
  input = el('input');
  input.name = 'username';
  input.setAttribute('aria-label', 'Nombre de la modelo');
  input.autocapitalize = 'off'; input.spellcheck = false;
  const button = el('button', null, 'Seguir');
  button.type = 'submit';
  form.append(input, button);
  msg = el('div'); msg.id = 'msg'; msg.setAttribute('role', 'alert');
  cards = el('div'); cards.id = 'cards';

  const parts = [];
  if (!session.lookups) {
    const notice = el('div', 'notice plate');
    notice.append('Tu plan de Statbate no incluye estos datos. ');
    if (/^https:\/\//.test(session.upgrade_url)) {
      const link = el('a', null, 'Mejorar el plan');
      link.href = session.upgrade_url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      notice.append(link);
    }
    parts.push(notice);
  } else if (session.plan.is_trial && session.plan.expires_on) {
    parts.push(el('div', 'notice plate',
      'Estás en periodo de prueba hasta el ' + new Date(session.plan.expires_on).toLocaleDateString('es-ES') + '.'));
  }
  parts.push(picker, form, msg, cards);
  main.replaceChildren(...parts);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!input.value.trim()) { msg.textContent = 'Escribe el nombre de una modelo.'; return; }
    msg.textContent = '';
    try {
      const added = await api('/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ site, username: input.value }),
      });
      input.value = '';
      session.follows.push(added);
      // un enlace pegado puede ser de la otra plataforma: se cambia a ella
      if (added.site !== site) selectSite(added.site); else follow(added.username);
    } catch (error) {
      msg.textContent = error.message;
    }
  });

  let saved = null;
  try { saved = localStorage.getItem('site'); } catch (e) {}
  selectSite(session.sites.some(s => s.id === saved) ? saved : session.sites[0].id);
  setInterval(() => rooms.forEach((room, name) => draw(name)), 30000);  // «hace X min»
}

function siteInfo() { return session.sites.find(s => s.id === site); }

function selectSite(id) {
  site = id;
  try { localStorage.setItem('site', id); } catch (e) {}
  const info = siteInfo();
  document.documentElement.style.setProperty('--accent', info.accent);
  document.querySelectorAll('.switch button').forEach(key =>
    key.setAttribute('aria-pressed', String(key.dataset.site === id)));
  input.placeholder = 'Nombre de la modelo o enlace de ' + info.label;
  msg.textContent = '';
  rooms.forEach(room => clearInterval(room.timer));
  rooms.clear();
  cards.replaceChildren();
  session.follows.filter(f => f.site === id).forEach(f => follow(f.username));
  renderEmpty();
}

function renderEmpty() {
  const note = document.getElementById('empty');
  if (rooms.size) { if (note) note.remove(); return; }
  if (note) return;
  const e = el('div', 'empty plate'); e.id = 'empty';
  e.append(el('b', null, 'Todavía no sigues a nadie en ' + siteInfo().label),
           document.createTextNode('Escribe arriba el nombre de una modelo y pulsa «Seguir».'));
  cards.append(e);
}

function follow(name) {
  const room = { el: el('section', 'card plate'), data: null, error: null, timer: null };
  rooms.set(name, room);
  // orden alfabético
  const after = [...rooms.keys()].filter(n => n.toLowerCase() > name.toLowerCase())
    .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()))[0];
  cards.insertBefore(room.el, after ? rooms.get(after).el : null);
  renderEmpty();
  draw(name);
  load(name);
  room.timer = setInterval(() => load(name), REFRESH_MS);
}

async function unfollow(name) {
  const room = rooms.get(name);
  const from = site;
  try { await api('/api/models/' + from + '/' + encodeURIComponent(name), { method: 'DELETE' }); }
  catch (error) { msg.textContent = error.message; return; }
  session.follows = session.follows.filter(f => !(f.site === from && f.username === name));
  if (rooms.get(name) !== room) return;
  clearInterval(room.timer);
  room.el.remove();
  rooms.delete(name);
  renderEmpty();
}

async function load(name) {
  const room = rooms.get(name);
  if (!room) return;
  try {
    room.data = await api('/api/room/' + site + '/' + encodeURIComponent(name));
    room.error = null;
  } catch (error) {
    if (error.message === '401') return;
    room.error = error.message;
  }
  if (rooms.get(name) === room) draw(name);
}

function dial(label, value) {
  const d = el('div', 'dial');
  d.append(el('div', 'label', label), el('div', 'value', value));
  return d;
}

function draw(name) {
  const room = rooms.get(name);
  const data = room.data;
  const list = room.el.querySelector('ul');
  const scroll = list ? list.scrollTop : 0;

  const head = el('div', 'head');
  const who = el('div', 'who');
  const title = el('div', 'name');
  const link = el('a', null, name);
  link.href = siteInfo().url + encodeURIComponent(name);
  link.target = '_blank'; link.rel = 'noopener noreferrer';
  title.append(link);
  const status = el('div', 'status');
  let led = 'led', label = 'Comprobando…';
  if (data) {
    led = data.online ? 'led live' : 'led';
    label = data.online ? 'En línea' : 'Desconectada (o el nombre no existe)';
  }
  if (room.error && !data) { led = 'led bad'; label = 'Sin datos'; }
  status.append(el('span', led), el('span', null, label));
  who.append(title, status);
  const remove = el('button', 'remove', 'Quitar');
  remove.type = 'button';
  remove.setAttribute('aria-label', 'Dejar de seguir a ' + name);
  remove.onclick = () => unfollow(name);
  head.append(who, remove);

  const parts = [head];
  if (room.error) parts.push(el('div', 'error', room.error));

  const dials = el('div', 'dials');
  dials.append(
    dial('Espectadores', data ? nf.format(data.viewers) : '—'),
    dial('Tokens última hora', data ? nf.format(data.tokens_hour) : '—'),
    dial('Tokens hoy', data ? nf.format(data.tokens_day) : '—'),
  );
  parts.push(dials);

  if (data && data.online) {
    const box = el('div', 'box');
    box.style.marginTop = '12px';
    const h3 = el('h3', null, 'En la sala');
    h3.append(el('span', null, 'tokens hoy · en total'));
    box.append(h3);
    if (data.users.length) {
      const ul = el('ul');
      for (const u of data.users) {
        const li = el('li');
        li.append(el('span', 'u', u.username),
                  el('span', 'amt', u.day ? nf.format(u.day) + ' tk' : '—'),
                  el('span', 'sub', nf.format(u.all_time) + ' tk'));
        ul.append(li);
      }
      box.append(ul);
    } else {
      box.append(el('div', 'note', 'Statbate no ve a nadie identificado en la sala ahora mismo.'));
    }
    parts.push(box);
    parts.push(el('div', 'foot',
      'Los tokens son los que han dado en esta sala quienes están dentro ahora. ' +
      'Datos de Statbate, tomados ' + (ago(data.cached_at) || 'hace un momento') + '; se renuevan cada minuto.'));
  }

  room.el.replaceChildren(...parts);
  const newList = room.el.querySelector('ul');
  if (newList) newList.scrollTop = scroll;
}

(async () => {
  try {
    session = await api('/api/session');
  } catch (error) {
    main.replaceChildren(el('div', 'empty plate', 'No se pudo conectar con {{APP_NAME}}. Recarga la página.'));
    return;
  }
  if (session.logged_in) showApp(); else showLogin();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<style>
  /* ---------- Aspecto por defecto: acero pulido ---------- */
  :root {
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    /* acero cepillado: vetas finas horizontales sobre un degradado frío */
    --page:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.035) 1px 2px, transparent 2px 4px),
      linear-gradient(115deg, #aeb5bd 0%, #dfe3e7 22%, #b9c0c8 45%, #e9ecef 63%, #a9b0b9 82%, #cfd4d9 100%);
    --bar: transparent; --bar-line: transparent; --bar-soft: #4d5661;
    --title: linear-gradient(180deg, #6b7480 0%, #2a3038 46%, #11161b 54%, #56606b 100%);
    --title-filter: drop-shadow(0 1px 0 rgba(255,255,255,.7));
    --ink: #1c2229; --ink-soft: #4d5661; --name-ink: #1c2229;
    --panel: linear-gradient(180deg, #f7f9fb 0%, #e4e8ec 38%, #c5cbd2 100%);
    --panel-border: #747c86;
    --panel-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.25), 0 10px 24px -10px rgba(20,30,40,.45);
    --radius: 10px;
    --btn: linear-gradient(180deg, #fff 0%, #dde1e6 45%, #b4bbc3 55%, #cdd2d8 100%);
    --btn-ink: #1c2229; --btn-border: #747c86; --btn-radius: 8px;
    --btn-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.3);
    --btn2: var(--btn); --btn2-ink: #1c2229; --btn2-border: #747c86;
    --key: var(--btn); --key-ink: #4d5661;
    --key-on: linear-gradient(180deg, #aeb5bd 0%, #c9ced4 50%, #dfe3e7 100%); --key-on-ink: #1c2229;
    --key-on-shadow: inset 0 2px 5px rgba(0,0,0,.4);
    --well: #12171c; --well-ink: #d9f2ff; --well-border: #05080a; --placeholder: #6f8491;
    --well-shadow: inset 0 2px 6px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.8);
    --dial: #12171c; --dial-label: #8fa5b3; --dial-value: #d9f2ff; --dial-glow: 0 0 10px rgba(120,205,255,.45);
    --dial-font: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
    --box: rgba(255,255,255,.55); --box-border: #9aa2ab; --box-shadow: inset 0 1px 3px rgba(0,0,0,.18);
    --row-line: rgba(0,0,0,.06);
    --accent: #1f6fa8;
    --amount: #1f6fa8; --amount-bg: transparent; --amount-pad: 0; --amount-radius: 0;
    --user-ink: var(--ink); --box-title: var(--ink-soft);
    --live: #1fb866; --off: #7d8590; --bad: #c8402f;
  }

  /* ---------- Chaturbate: azul noche, naranja, enlaces celestes, propinas en amarillo ---------- */
  :root[data-theme="chaturbate"] {
    --font: Ubuntu, "Helvetica Neue", Arial, Helvetica, sans-serif;
    --page: #18222d;
    --bar: #1c2a38; --bar-line: #2a3947; --bar-soft: #c9d1d9;
    --title: linear-gradient(#f47321, #f47321); --title-filter: none;
    --ink: #fff; --ink-soft: #aeb9c4; --name-ink: #5bb0e8; --user-ink: #6ea4ff; --box-title: #f47321;
    --panel: #1e2c3a; --panel-border: #2e3d4d; --panel-shadow: none; --radius: 6px;
    --btn: #e8650f; --btn-ink: #fff; --btn-border: #e8650f; --btn-radius: 999px; --btn-shadow: none;
    --btn2: transparent; --btn2-ink: #f58a45; --btn2-border: #f47321;
    --key: #151e27; --key-ink: #c9d1d9;
    --key-on: #e8650f; --key-on-ink: #fff; --key-on-shadow: none;
    --well: #151e27; --well-ink: #fff; --well-border: #33414f; --placeholder: #8c9aa8;
    --well-shadow: none;
    --dial: #151e27; --dial-label: #c9d1d9; --dial-value: #f58a45; --dial-glow: none;
    --dial-font: Ubuntu, "Helvetica Neue", Arial, Helvetica, sans-serif;
    --box: #18222d; --box-border: #2e3d4d; --box-shadow: none; --row-line: rgba(255,255,255,.06);
    --accent: #5bb0e8;
    --amount: #000; --amount-bg: #ffff33; --amount-pad: 1px 7px; --amount-radius: 3px;
    --off: #6f7f8f; --bad: #ff8a7a;
  }

  /* ---------- Stripchat: cabecera carmesí, paneles gris carbón redondeados, botón amarillo ---------- */
  :root[data-theme="stripchat"] {
    --font: Inter, Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
    --page: #1d1d1f;
    --bar: #a2262e; --bar-line: #a2262e; --bar-soft: #fff;
    --title: linear-gradient(#fff, #fff); --title-filter: none;
    --ink: #fff; --ink-soft: #a8a8ae; --name-ink: #fff; --user-ink: #ee6fe6;
    --panel: #2e2e31; --panel-border: #2e2e31; --panel-shadow: none; --radius: 14px;
    --btn: #f8b90c; --btn-ink: #1a1a1a; --btn-border: #f8b90c; --btn-radius: 999px; --btn-shadow: none;
    --btn2: transparent; --btn2-ink: #fff; --btn2-border: rgba(255,255,255,.75);
    --key: #3a3a3d; --key-ink: #d6d6da;
    --key-on: #a2262e; --key-on-ink: #fff; --key-on-shadow: none;
    --well: #232325; --well-ink: #fff; --well-border: #232325; --placeholder: #9a9aa0;
    --well-shadow: none;
    --dial: #262628; --dial-label: #a8a8ae; --dial-value: #fff; --dial-glow: none;
    --dial-font: Inter, Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
    --box: #262628; --box-border: #3a3a3d; --box-shadow: none; --row-line: rgba(255,255,255,.07);
    --accent: #ff7a84; --amount: #f8b90c;
    --live: #8ad62c; --off: #77777e; --bad: #ff8a7a;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 15px/1.45 var(--font);
    background: var(--page); background-attachment: fixed;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  main.wrap { padding-bottom: 56px; }

  .plate {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: var(--radius); box-shadow: var(--panel-shadow);
  }

  header { background: var(--bar); border-bottom: 3px solid var(--bar-line); margin-bottom: 18px; }
  header .wrap { display: flex; align-items: baseline; gap: 12px; padding-top: 22px; padding-bottom: 12px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  h1 a {
    text-decoration: none; color: transparent; cursor: pointer;
    background: var(--title); -webkit-background-clip: text; background-clip: text;
    filter: var(--title-filter);
  }
  h1 a:focus-visible { outline: 2px solid var(--bar-soft); outline-offset: 4px; }
  .tag { color: var(--bar-soft); font-size: 13px; }
  #user { margin-left: auto; font-size: 13px; color: var(--bar-soft); display: flex; align-items: center; gap: 10px; text-align: right; }

  button, .login a.go {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--btn-ink); text-decoration: none;
    padding: 12px 20px; border-radius: var(--btn-radius); border: 1px solid var(--btn-border);
    background: var(--btn); box-shadow: var(--btn-shadow);
  }
  button:hover, .login a.go:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  .add input:focus-visible, button:focus-visible, .login a.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .remove, #user button {
    padding: 7px 13px; font-size: 13px; font-weight: 600;
    background: var(--btn2); color: var(--btn2-ink); border-color: var(--btn2-border);
  }

  /* selector de plataforma: dos teclas; la elegida queda marcada */
  .switch { display: flex; margin-bottom: 14px; padding: 6px; }
  .switch button {
    flex: 1; border-radius: 0; font-size: 16px; padding: 12px 10px;
    background: var(--key); color: var(--key-ink); border-color: var(--panel-border);
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .switch button:first-child { border-radius: var(--btn-radius) 0 0 var(--btn-radius); }
  .switch button:last-child { border-radius: 0 var(--btn-radius) var(--btn-radius) 0; border-left: 0; }
  .switch button[aria-pressed="true"] { background: var(--key-on); color: var(--key-on-ink); box-shadow: var(--key-on-shadow); }
  .switch .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
  .switch button[aria-pressed="true"] .dot { background: currentColor; }

  .add { display: flex; gap: 10px; padding: 14px; }
  .add input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--well-ink);
    padding: 12px 14px; border-radius: var(--btn-radius); border: 1px solid var(--well-border);
    background: var(--well); box-shadow: var(--well-shadow);
  }
  .add input::placeholder { color: var(--placeholder); opacity: 1; }
  #msg { min-height: 20px; margin: 8px 4px 14px; font-size: 13px; color: var(--bad); font-weight: 600; }

  #cards { display: grid; gap: 18px; }
  .card { padding: 16px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .who { min-width: 0; flex: 1; }
  .name { font-size: 20px; font-weight: 800; overflow-wrap: anywhere; }
  .name a { color: var(--name-ink); text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink-soft); }
  .led { width: 11px; height: 11px; border-radius: 50%; flex: none; background: var(--off); box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
  .led.live { background: var(--live); box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 0 10px 2px rgba(31,184,102,.7); }
  .led.bad  { background: var(--bad); }
  .error { margin: 10px 2px 0; color: var(--bad); font-size: 13px; font-weight: 600; }

  .dials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  .dial {
    background: var(--dial); border-radius: min(var(--radius), 10px); padding: 10px 12px;
    border: 1px solid var(--well-border); box-shadow: var(--well-shadow);
  }
  .dial .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dial-label); }
  .dial .value {
    font: 700 30px/1.15 var(--dial-font); font-variant-numeric: tabular-nums;
    color: var(--dial-value); text-shadow: var(--dial-glow);
  }

  .box {
    margin-top: 12px; min-width: 0; overflow: hidden;
    background: var(--box); border: 1px solid var(--box-border);
    border-radius: min(var(--radius), 10px); box-shadow: var(--box-shadow);
  }
  .box h3 {
    margin: 0; padding: 8px 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--box-title); border-bottom: 1px solid var(--box-border);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .box h3 span { letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink-soft); }
  .box ul { list-style: none; margin: 0; padding: 4px 0; max-height: 230px; overflow-y: auto; }
  .box li { padding: 5px 12px; display: flex; gap: 8px; align-items: baseline; }
  .box li + li { border-top: 1px solid var(--row-line); }
  .box .u { font-weight: 600; overflow-wrap: anywhere; min-width: 0; color: var(--user-ink); }
  .box .amt { margin-left: auto; font-weight: 800; color: var(--amount); background: var(--amount-bg);
    padding: var(--amount-pad); border-radius: var(--amount-radius); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .box .amt.none { background: none; padding: 0; color: var(--ink-soft); font-weight: 500; }
  .box .sub { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .box .note { padding: 10px 12px; color: var(--ink-soft); font-size: 13px; }
  .foot { margin: 10px 2px 0; color: var(--ink-soft); font-size: 12px; }

  .empty { padding: 34px 18px; text-align: center; color: var(--ink-soft); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .login { padding: 34px 22px; text-align: center; }
  .login h2 { margin: 0 0 8px; font-size: 22px; }
  .login p { margin: 0 auto 18px; max-width: 520px; color: var(--ink-soft); }
  .login a.go { display: inline-block; font-size: 16px; padding: 13px 26px; }
  .login small { display: block; margin-top: 16px; color: var(--ink-soft); }
  .notice { padding: 12px 16px; margin-bottom: 14px; font-weight: 600; }
  .notice a { color: var(--accent); }

  @media (max-width: 640px) {
    h1 { font-size: 24px; }
    .tag { display: none; }
    .dials { gap: 8px; }
    .dial { padding: 8px; }
    .dial .value { font-size: 21px; }
    .dial .label { font-size: 10px; letter-spacing: .04em; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1><a href="/" id="home">{{APP_NAME}}</a></h1>
    <span class="tag">Contador en vivo de Stripchat y Chaturbate</span>
    <span id="user"></span>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
const main = document.getElementById('main');
const nf = new Intl.NumberFormat('es-ES');
const REFRESH_MS = 60000;
const rooms = new Map();   // modelo -> { el, data, error, timer }
let session = null;
let site = null;       // plataforma elegida
let input = null;
let form = null;
let cards = null;
let msg = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function ago(when) {
  if (!when) return '';
  const s = Math.max(0, (Date.now() - new Date(when).getTime()) / 1000);
  if (!(s < 86400 * 7)) return '';   // hora ilegible o absurda: mejor no mostrarla
  if (s < 90) return 'hace un momento';
  if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
  return 'hace ' + Math.floor(s / 3600) + ' h';
}

async function api(path, options) {
  const response = await fetch(path, Object.assign({ cache: 'no-store' }, options));
  if (response.status === 401) { location.href = '/'; throw new Error('401'); }
  let body = null;
  try { body = await response.json(); } catch (e) {}
  if (!response.ok) {
    const error = new Error((body && body.detail) || 'No se pudo completar la operación.');
    error.status = response.status;
    throw error;
  }
  return body;
}

const LOGIN_ERRORS = {
  denied: 'No se completó el inicio de sesión en Statbate.',
  state: 'El inicio de sesión caducó. Inténtalo de nuevo.',
  signin: 'Statbate no aceptó el inicio de sesión. Inténtalo de nuevo.',
  config: '{{APP_NAME}} todavía no está registrado en Statbate.',
};

function showLogin() {
  const box = el('section', 'login plate');
  box.append(el('h2', null, 'Sigue a tus modelos en vivo'));
  box.append(el('p', null,
    'Elige Stripchat o Chaturbate y mira si están en línea, quién está en la sala y cuántos tokens han dado. ' +
    'Los datos vienen de Statbate: entra con tu cuenta para verlos.'));
  const error = new URLSearchParams(location.search).get('error');
  if (error && LOGIN_ERRORS[error]) {
    const note = el('p', null, LOGIN_ERRORS[error]);
    note.style.color = 'var(--bad)'; note.style.fontWeight = '600';
    note.setAttribute('role', 'alert');
    box.append(note);
    history.replaceState(null, '', '/');
  }
  if (session.configured) {
    const go = el('a', 'go', 'Entrar con Statbate');
    go.href = '/oauth/statbate/login';
    box.append(go);
    box.append(el('small', null, 'Necesitas una cuenta de Statbate con plan Simple Plus o Studio Plus. {{APP_NAME}} nunca ve tu contraseña.'));
  } else {
    box.append(el('small', null, 'Falta configurar STATBATE_CLIENT_ID en el servidor.'));
  }
  main.replaceChildren(box);
}

function showApp() {
  const user = document.getElementById('user');
  const who = el('span', null, session.name + (session.plan.title ? ' · ' + session.plan.title : ''));
  const out = el('button', null, 'Salir');
  out.type = 'button';
  out.onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; };
  user.replaceChildren(who, out);

  const picker = el('div', 'switch plate');
  picker.setAttribute('role', 'group');
  picker.setAttribute('aria-label', 'Plataforma');
  for (const info of session.sites) {
    const key = el('button');
    key.type = 'button';
    key.dataset.site = info.id;
    key.append(el('span', 'dot'), el('span', null, info.label));
    // pulsar la tecla ya elegida vuelve al inicio metálico
    key.onclick = () => selectSite(site === info.id ? null : info.id);
    picker.append(key);
  }

  form = el('form', 'add plate');
  form.autocomplete = 'off';
  input = el('input');
  input.name = 'username';
  input.setAttribute('aria-label', 'Nombre de la modelo');
  input.autocapitalize = 'off'; input.spellcheck = false;
  const button = el('button', null, 'Seguir');
  button.type = 'submit';
  form.append(input, button);
  msg = el('div'); msg.id = 'msg'; msg.setAttribute('role', 'alert');
  cards = el('div'); cards.id = 'cards';

  const parts = [];
  if (!session.lookups) {
    const notice = el('div', 'notice plate');
    notice.append('Tu plan de Statbate no incluye estos datos. ');
    if (/^https:\/\//.test(session.upgrade_url)) {
      const link = el('a', null, 'Mejorar el plan');
      link.href = session.upgrade_url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      notice.append(link);
    }
    parts.push(notice);
  } else if (session.plan.is_trial && session.plan.expires_on) {
    parts.push(el('div', 'notice plate',
      'Estás en periodo de prueba hasta el ' + new Date(session.plan.expires_on).toLocaleDateString('es-ES') + '.'));
  }
  parts.push(picker, form, msg, cards);
  main.replaceChildren(...parts);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!input.value.trim()) { msg.textContent = 'Escribe el nombre de una modelo.'; return; }
    msg.textContent = '';
    try {
      const added = await api('/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ site, username: input.value }),
      });
      input.value = '';
      session.follows.push(added);
      // un enlace pegado puede ser de la otra plataforma: se cambia a ella
      if (added.site !== site) selectSite(added.site); else follow(added.username);
    } catch (error) {
      msg.textContent = error.message;
    }
  });

  document.getElementById('home').addEventListener('click', (event) => {
    event.preventDefault();
    selectSite(null);
  });
  selectSite(null);   // al abrir, aspecto metálico y ninguna plataforma elegida
  setInterval(() => rooms.forEach((room, name) => draw(name)), 30000);  // «hace X min»
}

function siteInfo() { return session.sites.find(s => s.id === site); }

function selectSite(id) {
  site = id;
  // el aspecto entero de la página sigue a la plataforma elegida
  if (id) document.documentElement.dataset.theme = id;
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('.switch button').forEach(key =>
    key.setAttribute('aria-pressed', String(key.dataset.site === id)));
  form.hidden = !id;
  if (id) input.placeholder = 'Nombre de la modelo o enlace de ' + siteInfo().label;
  msg.textContent = '';
  rooms.forEach(room => clearInterval(room.timer));
  rooms.clear();
  cards.replaceChildren();
  if (id) session.follows.filter(f => f.site === id).forEach(f => follow(f.username));
  renderEmpty();
}

function renderEmpty() {
  const old = document.getElementById('empty');
  if (old) old.remove();
  if (rooms.size) return;
  const e = el('div', 'empty plate'); e.id = 'empty';
  if (!site) {
    const counts = session.sites.map(info => {
      const n = session.follows.filter(f => f.site === info.id).length;
      return info.label + ': ' + n + (n === 1 ? ' modelo' : ' modelos');
    });
    e.append(el('b', null, 'Elige una plataforma'), document.createTextNode(counts.join(' · ')));
  } else {
    e.append(el('b', null, 'Todavía no sigues a nadie en ' + siteInfo().label),
             document.createTextNode('Escribe arriba el nombre de una modelo y pulsa «Seguir».'));
  }
  cards.append(e);
}

function follow(name) {
  const room = { el: el('section', 'card plate'), data: null, error: null, timer: null };
  rooms.set(name, room);
  // orden alfabético
  const after = [...rooms.keys()].filter(n => n.toLowerCase() > name.toLowerCase())
    .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()))[0];
  cards.insertBefore(room.el, after ? rooms.get(after).el : null);
  renderEmpty();
  draw(name);
  load(name);
  room.timer = setInterval(() => load(name), REFRESH_MS);
}

async function unfollow(name) {
  const room = rooms.get(name);
  const from = site;
  try { await api('/api/models/' + from + '/' + encodeURIComponent(name), { method: 'DELETE' }); }
  catch (error) { msg.textContent = error.message; return; }
  session.follows = session.follows.filter(f => !(f.site === from && f.username === name));
  if (rooms.get(name) !== room) return;
  clearInterval(room.timer);
  room.el.remove();
  rooms.delete(name);
  renderEmpty();
}

async function load(name) {
  const room = rooms.get(name);
  if (!room) return;
  try {
    room.data = await api('/api/room/' + site + '/' + encodeURIComponent(name));
    room.error = null;
  } catch (error) {
    if (error.message === '401') return;
    room.error = error.message;
  }
  if (rooms.get(name) === room) draw(name);
}

function dial(label, value) {
  const d = el('div', 'dial');
  d.append(el('div', 'label', label), el('div', 'value', value));
  return d;
}

function draw(name) {
  const room = rooms.get(name);
  const data = room.data;
  const list = room.el.querySelector('ul');
  const scroll = list ? list.scrollTop : 0;

  const head = el('div', 'head');
  const who = el('div', 'who');
  const title = el('div', 'name');
  const link = el('a', null, name);
  link.href = siteInfo().url + encodeURIComponent(name);
  link.target = '_blank'; link.rel = 'noopener noreferrer';
  title.append(link);
  const status = el('div', 'status');
  let led = 'led', label = 'Comprobando…';
  if (data) {
    led = data.online ? 'led live' : 'led';
    label = data.online ? 'En línea' : 'Desconectada (o el nombre no existe)';
  }
  if (room.error && !data) { led = 'led bad'; label = 'Sin datos'; }
  status.append(el('span', led), el('span', null, label));
  who.append(title, status);
  const remove = el('button', 'remove', 'Quitar');
  remove.type = 'button';
  remove.setAttribute('aria-label', 'Dejar de seguir a ' + name);
  remove.onclick = () => unfollow(name);
  head.append(who, remove);

  const parts = [head];
  if (room.error) parts.push(el('div', 'error', room.error));

  const dials = el('div', 'dials');
  dials.append(
    dial('Espectadores', data ? nf.format(data.viewers) : '—'),
    dial('Tokens última hora', data ? nf.format(data.tokens_hour) : '—'),
    dial('Tokens hoy', data ? nf.format(data.tokens_day) : '—'),
  );
  parts.push(dials);

  if (data && data.online) {
    const box = el('div', 'box');
    const h3 = el('h3', null, 'En la sala');
    h3.append(el('span', null, 'tokens hoy · en total'));
    box.append(h3);
    if (data.users.length) {
      const ul = el('ul');
      for (const u of data.users) {
        const li = el('li');
        li.append(el('span', 'u', u.username),
                  el('span', u.day ? 'amt' : 'amt none', u.day ? nf.format(u.day) + ' tk' : '—'),
                  el('span', 'sub', nf.format(u.all_time) + ' tk'));
        ul.append(li);
      }
      box.append(ul);
    } else {
      box.append(el('div', 'note', 'Statbate no ve a nadie identificado en la sala ahora mismo.'));
    }
    parts.push(box);
    parts.push(el('div', 'foot',
      'Los tokens son los que han dado en esta sala quienes están dentro ahora. ' +
      'Datos de Statbate, tomados ' + (ago(data.cached_at) || 'hace un momento') + '; se renuevan cada minuto.'));
  }

  room.el.replaceChildren(...parts);
  const newList = room.el.querySelector('ul');
  if (newList) newList.scrollTop = scroll;
}

(async () => {
  try {
    session = await api('/api/session');
  } catch (error) {
    main.replaceChildren(el('div', 'empty plate', 'No se pudo conectar con {{APP_NAME}}. Recarga la página.'));
    return;
  }
  if (session.logged_in) showApp(); else showLogin();
})();
</script>
